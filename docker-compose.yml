services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn goldpulse.api.main:api --host 0.0.0.0 --port 8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    ports: ["127.0.0.1:8000:8000"]       # bind to localhost; n8n reaches it as http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1/health',headers={'X-API-Key':os.environ.get('GOLDPULSE_API_KEY','')}))"]
      interval: 30s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on: [api]
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/import:ro
    ports: ["127.0.0.1:5678:5678"]

volumes:
  pgdata:
  n8ndata:
