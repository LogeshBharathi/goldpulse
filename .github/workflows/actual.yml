name: actual
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goldpulse
  cancel-in-progress: false
jobs:
  actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.scrape_board --if-missing
      - run: python -m src.score_and_learn
      - run: python -m src.build_site
      - name: Commit the board and the score
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Record today's board and score"
          git pull --rebase origin main
          git push
      - name: Notify on failure
        if: failure()
        run: python -m src.notify "Board scrape or scoring failed"
